[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "pls"
version = "0.2.0"
authors = [
  { name="Martim Videira", email="mitram790@gmail.com" },
  { name="Pedro Oliveira", email="pedro.oliveriag@gmail.com"}
]
description = "pls: Prolog Language Server"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
  "tree-sitter==0.24.0",
  "pygls==2.1.1",
  "tree-sitter-prolog @ {root:uri}/tree-sitter-prolog",
  "tree-sitter-pldoc @ {root:uri}/tree-sitter-pldoc",
  "platformdirs==4.11.0",
]

[project.urls]
Homepage = "https://github.com/MartimVideira/pls"
Issues = "https://github.com/MartimVideira/pls/issues"

[project.scripts]
pls = "pls.main:main"

[tool.setuptools.package-data]
"pls" = ["data/*"]